<!doctype html>
<html lang="tr"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><title>Dev: items</title>
<style>
  #dev-bar { position: fixed; top: 0; left: 0; right: 0; z-index: 99999; display: flex; flex-wrap: wrap; gap: 4px; padding: 5px 8px; background: rgba(0,0,0,.85); border-bottom: 1px solid #5a4423; font: 12px/1 sans-serif; pointer-events: auto; }
  #dev-bar button, #dev-bar select, #dev-bar input { font: 700 11px sans-serif; padding: 4px 8px; color: #f1dfae; background: #2a1c10; border: 1px solid #7a5d2c; cursor: pointer; }
  #dev-bar input { width: 46px; cursor: text; }
  #dev-bar button:hover { background: #4a3520; }
  #dev-bar span { color: #8a7a5a; align-self: center; margin: 0 4px; }
  #dev-panel { position: fixed; top: 34px; right: 0; bottom: 0; width: 470px; z-index: 9999; background: rgba(10,8,6,.9); border-left: 1px solid #5a4423; color: #e8dcc0; font: 13px/1.35 'Alegreya Sans', sans-serif; display: flex; flex-direction: column; pointer-events: auto; user-select: text; }
  #dev-tabs { display: flex; border-bottom: 1px solid #5a4423; }
  #dev-tabs button { flex: 1; padding: 6px; font: 700 12px sans-serif; color: #c9b98a; background: #1a120a; border: 0; border-right: 1px solid #3a2a14; cursor: pointer; }
  #dev-tabs button.on { background: #3a2a14; color: #ffe7a3; }
  #dev-body { flex: 1; overflow: auto; padding: 8px; }
  .card { border: 1px solid #444; background: #14100c; padding: 6px 8px; margin: 0 0 8px; border-left-width: 4px; }
  .card h4 { margin: 0 0 2px; font: 700 14px 'Cinzel', serif; }
  .card .sub { color: #9a8f78; font-size: 11px; margin-bottom: 3px; }
  .card .ln { margin: 1px 0; }
  .card .dim { color: #8a8070; }
  .card .aff { color: #8fb4ff; }
  .card .uni { color: #ffa94d; }
  .card .set { color: #7be8c4; }
  .card .gold { color: #f2c037; }
  table.t { border-collapse: collapse; width: 100%; font: 12px monospace; }
  table.t td, table.t th { border-bottom: 1px solid #2a2218; padding: 2px 4px; text-align: right; }
  table.t td:first-child, table.t th:first-child { text-align: left; }
  .ok { color: #7be87b; } .bad { color: #ff6a6a; }
  #dev-log { font: 11px/1.4 monospace; white-space: pre-wrap; }
  #dev-toasts { position: fixed; top: 44px; left: 50%; transform: translateX(-50%); z-index: 99998; display: flex; flex-direction: column; gap: 6px; align-items: center; pointer-events: none; }
  #dev-toasts div { padding: 6px 16px; background: rgba(20,14,8,.92); border: 1px solid #c9a24a; color: #f1e6cf; font: 15px 'Alegreya Sans', sans-serif; animation: devt 3s forwards; }
  @keyframes devt { 0% { opacity: 0; transform: translateY(-8px); } 8% { opacity: 1; transform: none; } 85% { opacity: 1; } 100% { opacity: 0; } }
</style></head>
<body><div id="game-root" style="top:0"><canvas id="game-canvas"></canvas><div id="ui-root"></div></div>
<div id="dev-bar"></div>
<div id="dev-panel"><div id="dev-tabs"></div><div id="dev-body"></div></div>
<div id="dev-toasts"></div>
<script type="module" src="/src/dev/items.ts"></script></body></html>
